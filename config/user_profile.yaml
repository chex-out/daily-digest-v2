user:
  name: Abraham
  role: "Digital Marketer and aspiring Customer Lifecycle Marketer"
  email: lee.abraham.e@gmail.com
  location: "Singapore"

interests:
  high_priority:
    - AI agents and agentic systems
    - AI research breakthroughs and new model releases
    - digital marketing and marketing automation
    - customer data platforms and CDP
    - B2B marketing strategy
  medium_priority:
    - AI applications in marketing
    - marketing practices
  low_priority:
    - general tech news (only if significant)
    - Premier League and Formula 1 news
    - Singapore local events (tech meetups, AI events preferred)
    - cheap/free Singapore activities

known_sources:
  - name: "Sam Kuehnle's Blog"
    type: rss
    url: "https://www.samkuehnle.com/feed"
    always_include: false
    notes: "Usually has insightful reflections on marketing."

  - name: "TLDR Newsletter"
    type: imap
    sender: "dan@tldrnewsletter.com"
    subject_keyword: "TLDR"
    always_include: false
    notes: "Good for headlines. Extract top 4-5 AI/tech stories."

  - name: "TLDR Marketing Newsletter"
    type: imap
    sender: "dan@tldrnewsletter.com"
    subject_keyword: "TLDR"
    always_include: true
    notes: "Good for headlines. Extract top 4-5 marketing stories."

  - name: "TechCrunch"
    type: rss
    url: "https://techcrunch.com/feed/"
    always_include: false
    notes: "Focus on AI/ML news, skip funding news."

  - name: "Product Hunt"
    type: rss
    url: "https://www.producthunt.com/feed"
    always_include: false
    notes: "Top 5 most interesting new products."

  - name: "Lenny's Newsletter"
    type: imap
    sender: "lenny@lennysnewsletter.com"
    subject_keyword: "Lenny"
    always_include: true
    notes: "Include even if paywalled — summarise what's available."

  - name: "Elena's Growth Scoop"
    type: imap
    sender: "elenaverna@substack.com"
    subject_keyword: "Elena's Growth Scoop"
    always_include: false
    notes: "Include even if paywalled — summarise what's available."

  - name: "Dan Hock's Essays"
    type: imap
    sender: "danhock@substack.com"
    subject_keyword: "Dan Hock"
    always_include: false
    notes: "Include even if paywalled — summarise what's available."

  - name: "The Skip"
    type: imap
    sender: "theskip@substack.com"
    subject_keyword: "The Skip"
    always_include: false
    notes: "Include even if paywalled — summarise what's available."

  - name: "The Athletic"
    type: imap
    sender: "TheAthletic@e1.theathletic.com"
    subject_keyword: "The Briefing"
    always_include: false
    notes: "Include even if paywalled — summarise what's available."

  - name: "Funcheap SF"
    type: rss
    url: "https://feeds.feedburner.com/funcheapsf_recent_added_events/"
    always_include: false
    notes: "Only include if 3+ relevant events this week."

content_rules:
  max_digest_items: 20
  min_relevance_score: 0.6
  stale_after_hours: 48
  prefer_themes_over_sources: true
  # When true, the agent should group items by theme (e.g. "AI agents")
  # rather than by source (e.g. "Simon Willison")

agent_directives:
  enable_web_search: true  # requires BRAVE_SEARCH_API_KEY; returns [] gracefully if not set
  web_search_triggers:
    - "If a known source fails to fetch, search for similar coverage"
    - "If there's a major AI news story referenced but not fully covered by sources"
    - "To find SF tech meetups if Luma/Eventbrite data is unavailable"
  max_web_searches: 3
  output_format: "html_file"
  html_output_path: "/tmp/digest-v2.html"
